name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats jq shellcheck python3-jsonschema
      - name: Install the e2b SDK, for the fake SDK's contract test
        run: python3 -m pip install --user --break-system-packages e2b==2.51.0
      - name: make check
        env:
          CR_REQUIRE_E2B_SDK: "1"
        run: make check
